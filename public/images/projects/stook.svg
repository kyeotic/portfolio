<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!--
    Isometric vectors:
      Width  (+46, +20)  — left face, wider
      Depth  (+20, −10)  — right face
      Height ( 0,  +34)

    Left face:  TL(7,20)  TR(53,40) BR(53,74) BL(7,54)
    Right face: TL(53,40) TR(73,30) BR(73,64) BL(53,74)
    Top face:   FL(7,20)  FR(53,40) BR(73,30) BL(27,10)

    D-ring: semicircle in depth-height plane, mounted at cx=40 cy=25.5
      matrix(1,-0.5,0,1,40,25.5): local(x,y) → screen(x+40, -0.5x+y+25.5)
      Apex      (0,-5) → (40, 20.5)
      Right bas (5, 0) → (45, 23)    ← coincides with hook jaw rightmost point
      Left base (-5, 0)→ (35, 28)

    Hook jaw: large CW arc center=(40,23) r=5, from (40,18) through (45,23),(40,28) to (35,23)
    D-ring base line (35,28)→(45,23) crosses hook jaw arc at (37,27).

    Chain-link draw order:
      1. Ring near arc  — behind hook jaw (hook appears in front on left/near side)
      2. Hook (cable + shank + jaw)
      3. Ring far arc   — in front of hook jaw (ring appears in front on right/far side)
      4. Ring base line — in front, crosses hook jaw arc at (37,27)
  -->

  <!-- Left face -->
  <polygon points="7,20 53,40 53,74 7,54" fill="#2471a3"/>

  <!-- Right face -->
  <polygon points="53,40 73,30 73,64 53,74" fill="#1a5276"/>

  <!-- Top face -->
  <polygon points="7,20 53,40 73,30 27,10" fill="#2e86c1"/>

  <!-- Left face ribs (height=34, spacing 34/3 ≈ 11) -->
  <line x1="7"  y1="31" x2="53" y2="51" stroke="#1a5276" stroke-width="1.5" opacity="0.8"/>
  <line x1="7"  y1="43" x2="53" y2="63" stroke="#1a5276" stroke-width="1.5" opacity="0.8"/>

  <!-- Right face ribs -->
  <line x1="53" y1="51" x2="73" y2="41" stroke="#0d2e47" stroke-width="1.5" opacity="0.8"/>
  <line x1="53" y1="63" x2="73" y2="53" stroke="#0d2e47" stroke-width="1.5" opacity="0.8"/>

  <!-- Edge outlines -->
  <polyline points="27,10 7,20 7,54 53,74 73,64 73,30 27,10"
            fill="none" stroke="#0d2e47" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="7"  y1="20" x2="53" y2="40" stroke="#0d2e47" stroke-width="1.5"/>
  <line x1="53" y1="40" x2="73" y2="30" stroke="#0d2e47" stroke-width="1.5"/>
  <line x1="53" y1="40" x2="53" y2="74" stroke="#0d2e47" stroke-width="1.5"/>

  <!-- Corner structural posts -->
  <rect x="5"  y="20" width="4" height="34" rx="1" fill="#1a5276"/>
  <rect x="51" y="40" width="4" height="34" rx="1" fill="#1a5276"/>
  <rect x="71" y="30" width="4" height="34" rx="1" fill="#0d2e47"/>

  <!-- S: skewY matches face slope (20/46 ≈ 23°); centroid at (30,47) -->
  <g transform="translate(30,47) skewY(23)">
    <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900"
          text-anchor="middle" dominant-baseline="middle" fill="white">S</text>
  </g>

  <!-- 1. Ring near arc: local(0,-5)→(-5,0) CCW — drawn first, hook jaw will be on top -->
  <path d="M 0 -5 A 5 5 0 0 0 -5 0"
        transform="matrix(1,-0.5,0,1,40,25.5)"
        fill="none" stroke="#999" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 2. Cable + hook -->
  <line x1="40" y1="0" x2="40" y2="8" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 8 L 40 18 A 5 5 0 1 1 35 23"
        stroke="#c8c8c8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Ring far arc: local(5,0)→(0,-5) CCW — drawn over hook jaw on right/far side -->
  <path d="M 5 0 A 5 5 0 0 0 0 -5"
        transform="matrix(1,-0.5,0,1,40,25.5)"
        fill="none" stroke="#999" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 4. Ring base — drawn last; crosses hook jaw arc at (37,27) -->
  <line x1="35" y1="28" x2="45" y2="23"
        stroke="#999" stroke-width="3.5" stroke-linecap="round"/>
</svg>
