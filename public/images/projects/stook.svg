<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Cable from top -->
  <line x1="40" y1="0" x2="40" y2="5" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hook: smaller shank leads into clockwise arc, arc bottom enters box notch -->
  <path d="M 40 5 L 40 14 A 9 9 0 1 1 32 28"
        stroke="#c8c8c8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Container body with semicircular cutout at top center matching hook arc -->
  <!-- Arc from (52,20) clockwise through bottom (40,32) to (28,20), radius 12 -->
  <path d="M 7 20 L 7 78 Q 7 80 9 80 L 71 80 Q 73 80 73 78 L 73 20 L 52 20 A 12 12 0 0 1 28 20 Z"
        fill="#2471a3"/>
  <path d="M 7 20 L 7 78 Q 7 80 9 80 L 71 80 Q 73 80 73 78 L 73 20 L 52 20 A 12 12 0 0 1 28 20 Z"
        fill="none" stroke="#1a5276" stroke-width="2"/>


  <!-- Horizontal panel ribs -->
  <line x1="7" y1="43" x2="73" y2="43" stroke="#1a5276" stroke-width="1.5" opacity="0.8"/>
  <line x1="7" y1="57" x2="73" y2="57" stroke="#1a5276" stroke-width="1.5" opacity="0.8"/>
  <line x1="7" y1="71" x2="73" y2="71" stroke="#1a5276" stroke-width="1.5" opacity="0.8"/>

  <!-- Corner structural posts -->
  <rect x="5" y="20" width="6" height="60" rx="1" fill="#1a5276"/>
  <rect x="69" y="20" width="6" height="60" rx="1" fill="#1a5276"/>

  <!-- S -->
  <text x="40" y="58" font-family="Arial Black, Arial, sans-serif" font-size="27" font-weight="900"
        text-anchor="middle" dominant-baseline="middle" fill="white">S</text>
</svg>
